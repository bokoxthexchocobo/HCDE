name: C# cross-language soak

on:
  workflow_dispatch:
  schedule:
  # Weekly Monday 06:00 UTC when hcdeserv/IWAD secrets are configured.
    - cron: '0 6 * * 1'

permissions:
  contents: write

jobs:
  soak:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Cross-language soak tests
        env:
          HCDE_HCDESERV_PATH: ${{ secrets.HCDE_HCDESERV_PATH }}
          HCDE_IWAD_PATH: ${{ secrets.HCDE_IWAD_PATH }}
          HCDE_IWAD_CRC: ${{ secrets.HCDE_IWAD_CRC }}
          HCDE_HCDE_CLIENT_PATH: ${{ secrets.HCDE_HCDE_CLIENT_PATH }}
          HCDE_SOAK_EVIDENCE_DIR: ${{ runner.temp }}/hcde-soak-evidence
        run: |
          cd csharp
          dotnet build
          dotnet test --no-build --filter "FullyQualifiedName~CrossLanguageSoak"
      - name: Record validation soak evidence
        if: ${{ secrets.HCDE_HCDESERV_PATH != '' && secrets.HCDE_IWAD_PATH != '' }}
        env:
          HCDE_HCDESERV_PATH: ${{ secrets.HCDE_HCDESERV_PATH }}
          HCDE_IWAD_PATH: ${{ secrets.HCDE_IWAD_PATH }}
          HCDE_IWAD_CRC: ${{ secrets.HCDE_IWAD_CRC }}
          HCDE_HCDE_CLIENT_PATH: ${{ secrets.HCDE_HCDE_CLIENT_PATH }}
          HCDE_RECORD_VALIDATION_EVIDENCE: '1'
        run: |
          cd csharp
          dotnet test --no-build --filter "FullyQualifiedName~RecordValidationPassedEvidence"
      - name: Refresh committed soak templates
        if: ${{ secrets.HCDE_HCDESERV_PATH != '' && secrets.HCDE_IWAD_PATH != '' }}
        env:
          HCDE_HCDESERV_PATH: ${{ secrets.HCDE_HCDESERV_PATH }}
          HCDE_IWAD_PATH: ${{ secrets.HCDE_IWAD_PATH }}
          HCDE_IWAD_CRC: ${{ secrets.HCDE_IWAD_CRC }}
          HCDE_HCDE_CLIENT_PATH: ${{ secrets.HCDE_HCDE_CLIENT_PATH }}
          HCDE_REFRESH_SOAK_TEMPLATES: '1'
        run: |
          cd csharp
          dotnet test --no-build --filter "FullyQualifiedName~RefreshCommittedEvidence_ReplacesStaleHarnessFiles"
      - name: Verify Passed manifest after refresh
        if: ${{ secrets.HCDE_HCDESERV_PATH != '' && secrets.HCDE_IWAD_PATH != '' }}
        env:
          HCDE_HCDESERV_PATH: ${{ secrets.HCDE_HCDESERV_PATH }}
          HCDE_IWAD_PATH: ${{ secrets.HCDE_IWAD_PATH }}
          HCDE_IWAD_CRC: ${{ secrets.HCDE_IWAD_CRC }}
          HCDE_HCDE_CLIENT_PATH: ${{ secrets.HCDE_HCDE_CLIENT_PATH }}
          HCDE_RECORD_PASSED_VALIDATION_EVIDENCE: '1'
        run: |
          cd csharp
          dotnet test --no-build --filter "FullyQualifiedName~TryRecordPassedValidationEvidence_PassesGateWhenBinariesPresent"
      - name: Export soak templates for commit
        if: ${{ secrets.HCDE_HCDESERV_PATH != '' && secrets.HCDE_IWAD_PATH != '' }}
        env:
          HCDE_EXPORT_SOAK_TEMPLATES: '1'
          HCDE_SOAK_TEMPLATE_EXPORT_DIR: ${{ runner.temp }}/soak-templates-for-commit
        run: |
          cd csharp
          dotnet test --no-build --filter "FullyQualifiedName~ExportCommittedTemplates_WritesCiArtifactBundle"
      - name: Apply soak templates to repository
        if: ${{ secrets.HCDE_HCDESERV_PATH != '' && secrets.HCDE_IWAD_PATH != '' }}
        env:
          HCDE_APPLY_SOAK_TEMPLATES: '1'
          HCDE_SOAK_TEMPLATE_EXPORT_DIR: ${{ runner.temp }}/soak-templates-for-commit
        run: |
          cd csharp
          dotnet test --no-build --filter "FullyQualifiedName~ApplyExportedTemplates_WritesCommittedSoakTree"
      - name: Reject stale export bundle before soak template commit
        if: ${{ secrets.HCDE_HCDESERV_PATH != '' && secrets.HCDE_IWAD_PATH != '' }}
        env:
          HCDE_SOAK_EVIDENCE_MAX_AGE_DAYS: '8'
        run: |
          cd csharp
          dotnet test --no-build --filter "FullyQualifiedName~ApplyExportedTemplates_RejectsStaleBundleEvidence"
      - name: Commit refreshed soak templates
        if: ${{ secrets.HCDE_HCDESERV_PATH != '' && secrets.HCDE_IWAD_PATH != '' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add csharp/validation/soak/
          if git diff --staged --quiet; then
            echo "No soak template changes to commit."
          else
            git commit -m "chore(soak): refresh cross-language Passed templates [skip ci]"
            git push
          fi
      - name: Enforce Passed soak gate
        if: ${{ secrets.HCDE_HCDESERV_PATH != '' && secrets.HCDE_IWAD_PATH != '' }}
        env:
          HCDE_HCDESERV_PATH: ${{ secrets.HCDE_HCDESERV_PATH }}
          HCDE_IWAD_PATH: ${{ secrets.HCDE_IWAD_PATH }}
          HCDE_ENFORCE_SOAK_GATE: '1'
          HCDE_SOAK_MANIFEST_MAX_AGE_DAYS: '8'
          HCDE_SOAK_EVIDENCE_MAX_AGE_DAYS: '8'
        run: |
          cd csharp
          dotnet test --no-build --filter "FullyQualifiedName~Evaluate_RequiresPassedManifestWhenSecretsConfigured"
      - name: Enforce evidence freshness gate
        if: ${{ secrets.HCDE_HCDESERV_PATH != '' && secrets.HCDE_IWAD_PATH != '' }}
        env:
          HCDE_HCDESERV_PATH: ${{ secrets.HCDE_HCDESERV_PATH }}
          HCDE_IWAD_PATH: ${{ secrets.HCDE_IWAD_PATH }}
          HCDE_ENFORCE_SOAK_GATE: '1'
          HCDE_SOAK_EVIDENCE_MAX_AGE_DAYS: '8'
        run: |
          cd csharp
          dotnet test --no-build --filter "FullyQualifiedName~Evaluate_EnforcesEvidenceFreshnessWhenSecretsConfigured"
      - name: Upload soak evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: csharp-soak-evidence
          path: |
            ${{ runner.temp }}/hcde-soak-evidence/*.json
            ${{ runner.temp }}/soak-templates-for-commit/**
            csharp/validation/soak/evidence/*.json
            csharp/validation/soak/manifest.json
