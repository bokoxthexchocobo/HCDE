name: C# tests

on:
  push:
    paths:
      - 'csharp/**'
      - '.github/workflows/csharp.yml'
  pull_request:
    paths:
      - 'csharp/**'
      - '.github/workflows/csharp.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build and test
        run: |
          cd csharp
          dotnet build
          dotnet test --no-build
      - name: Enforce Passed soak gate
        if: ${{ secrets.HCDE_HCDESERV_PATH != '' && secrets.HCDE_IWAD_PATH != '' }}
        env:
          HCDE_HCDESERV_PATH: ${{ secrets.HCDE_HCDESERV_PATH }}
          HCDE_IWAD_PATH: ${{ secrets.HCDE_IWAD_PATH }}
          HCDE_ENFORCE_SOAK_GATE: '1'
          HCDE_SOAK_MANIFEST_MAX_AGE_DAYS: '8'
          HCDE_SOAK_EVIDENCE_MAX_AGE_DAYS: '8'
        run: |
          cd csharp
          dotnet test --no-build --filter "FullyQualifiedName~CrossLanguageSoakGateTests"
      - name: Enforce Passed manifest gate
        if: ${{ secrets.HCDE_HCDESERV_PATH != '' && secrets.HCDE_IWAD_PATH != '' }}
        env:
          HCDE_HCDESERV_PATH: ${{ secrets.HCDE_HCDESERV_PATH }}
          HCDE_IWAD_PATH: ${{ secrets.HCDE_IWAD_PATH }}
          HCDE_ENFORCE_SOAK_GATE: '1'
          HCDE_SOAK_MANIFEST_MAX_AGE_DAYS: '8'
          HCDE_SOAK_EVIDENCE_MAX_AGE_DAYS: '8'
        run: |
          cd csharp
          dotnet test --no-build --filter "FullyQualifiedName~Evaluate_RequiresPassedManifestWhenSecretsConfigured"
      - name: Enforce dual manifest+evidence freshness gate
        if: ${{ secrets.HCDE_HCDESERV_PATH != '' && secrets.HCDE_IWAD_PATH != '' }}
        env:
          HCDE_HCDESERV_PATH: ${{ secrets.HCDE_HCDESERV_PATH }}
          HCDE_IWAD_PATH: ${{ secrets.HCDE_IWAD_PATH }}
          HCDE_ENFORCE_SOAK_GATE: '1'
          HCDE_SOAK_MANIFEST_MAX_AGE_DAYS: '8'
          HCDE_SOAK_EVIDENCE_MAX_AGE_DAYS: '8'
        run: |
          cd csharp
          dotnet test --no-build --filter "FullyQualifiedName~Evaluate_EnforcesDualFreshnessWhenSecretsConfigured"
      - name: Enforce committed template export freshness gate
        if: ${{ secrets.HCDE_HCDESERV_PATH != '' && secrets.HCDE_IWAD_PATH != '' }}
        env:
          HCDE_HCDESERV_PATH: ${{ secrets.HCDE_HCDESERV_PATH }}
          HCDE_IWAD_PATH: ${{ secrets.HCDE_IWAD_PATH }}
          HCDE_ENFORCE_SOAK_GATE: '1'
          HCDE_SOAK_MANIFEST_MAX_AGE_DAYS: '8'
          HCDE_SOAK_EVIDENCE_MAX_AGE_DAYS: '8'
        run: |
          cd csharp
          dotnet test --no-build --filter "FullyQualifiedName~ExportCommittedTemplates_RejectsStaleCommittedManifest"
      - name: Enforce apply-bundle dual freshness gate
        if: ${{ secrets.HCDE_HCDESERV_PATH != '' && secrets.HCDE_IWAD_PATH != '' }}
        env:
          HCDE_SOAK_MANIFEST_MAX_AGE_DAYS: '8'
          HCDE_SOAK_EVIDENCE_MAX_AGE_DAYS: '8'
        run: |
          cd csharp
          dotnet test --no-build --filter "FullyQualifiedName~ApplyExportedTemplates_RejectsStale"
      - name: Enforce evidence freshness gate
        if: ${{ secrets.HCDE_HCDESERV_PATH != '' && secrets.HCDE_IWAD_PATH != '' }}
        env:
          HCDE_HCDESERV_PATH: ${{ secrets.HCDE_HCDESERV_PATH }}
          HCDE_IWAD_PATH: ${{ secrets.HCDE_IWAD_PATH }}
          HCDE_ENFORCE_SOAK_GATE: '1'
          HCDE_SOAK_EVIDENCE_MAX_AGE_DAYS: '8'
        run: |
          cd csharp
          dotnet test --no-build --filter "FullyQualifiedName~Evaluate_EnforcesEvidenceFreshnessWhenSecretsConfigured"
      - name: Enforce manifest staleness gate
        if: ${{ secrets.HCDE_HCDESERV_PATH != '' && secrets.HCDE_IWAD_PATH != '' }}
        env:
          HCDE_SOAK_MANIFEST_MAX_AGE_DAYS: '8'
        run: |
          cd csharp
          dotnet test --no-build --filter "FullyQualifiedName~EvaluateManifestStaleness_PassesWhenWithinMaxAge"
      - name: Enforce stale manifest rejection gate
        if: ${{ secrets.HCDE_HCDESERV_PATH != '' && secrets.HCDE_IWAD_PATH != '' }}
        env:
          HCDE_SOAK_MANIFEST_MAX_AGE_DAYS: '8'
        run: |
          cd csharp
          dotnet test --no-build --filter "FullyQualifiedName~Evaluate_FailsWhenManifestIsStale"
      - name: Enforce stale evidence rejection gate
        if: ${{ secrets.HCDE_HCDESERV_PATH != '' && secrets.HCDE_IWAD_PATH != '' }}
        env:
          HCDE_SOAK_EVIDENCE_MAX_AGE_DAYS: '8'
        run: |
          cd csharp
          dotnet test --no-build --filter "FullyQualifiedName~Evaluate_FailsWhenEvidenceFileIsStale"
      - name: Enforce missing evidence rejection gate
        if: ${{ secrets.HCDE_HCDESERV_PATH != '' && secrets.HCDE_IWAD_PATH != '' }}
        run: |
          cd csharp
          dotnet test --no-build --filter "FullyQualifiedName~Evaluate_FailsWhenEvidenceFileIsMissing"
      - name: Enforce skipped harness rejection gate
        if: ${{ secrets.HCDE_HCDESERV_PATH != '' && secrets.HCDE_IWAD_PATH != '' }}
        run: |
          cd csharp
          dotnet test --no-build --filter "FullyQualifiedName~Evaluate_FailsWhenManifestContainsSkippedHarness"
      - name: Enforce passed evidence freshness gate
        if: ${{ secrets.HCDE_HCDESERV_PATH != '' && secrets.HCDE_IWAD_PATH != '' }}
        env:
          HCDE_SOAK_EVIDENCE_MAX_AGE_DAYS: '8'
        run: |
          cd csharp
          dotnet test --no-build --filter "FullyQualifiedName~EvaluateEvidenceFreshness_PassesWhenWithinMaxAge"
      - name: Enforce committed dual freshness stale manifest rejection gate
        if: ${{ secrets.HCDE_HCDESERV_PATH != '' && secrets.HCDE_IWAD_PATH != '' }}
        env:
          HCDE_SOAK_MANIFEST_MAX_AGE_DAYS: '8'
          HCDE_SOAK_EVIDENCE_MAX_AGE_DAYS: '8'
        run: |
          cd csharp
          dotnet test --no-build --filter "FullyQualifiedName~EvaluateCommittedDualFreshness_FailsWhenManifestIsStale"
      - name: Enforce stale export bundle evidence rejection gate
        if: ${{ secrets.HCDE_HCDESERV_PATH != '' && secrets.HCDE_IWAD_PATH != '' }}
        env:
          HCDE_SOAK_EVIDENCE_MAX_AGE_DAYS: '8'
        run: |
          cd csharp
          dotnet test --no-build --filter "FullyQualifiedName~ApplyExportedTemplates_RejectsStaleBundleEvidence"
      - name: Enforce stale export manifest rejection gate
        if: ${{ secrets.HCDE_HCDESERV_PATH != '' && secrets.HCDE_IWAD_PATH != '' }}
        env:
          HCDE_SOAK_MANIFEST_MAX_AGE_DAYS: '8'
          HCDE_SOAK_EVIDENCE_MAX_AGE_DAYS: '8'
        run: |
          cd csharp
          dotnet test --no-build --filter "FullyQualifiedName~ApplyExportedTemplates_RejectsStaleExportManifest"
      - name: Enforce soak gate not required when secrets missing
        if: ${{ secrets.HCDE_HCDESERV_PATH == '' || secrets.HCDE_IWAD_PATH == '' }}
        run: |
          cd csharp
          dotnet test --no-build --filter "FullyQualifiedName~Evaluate_ReturnsNotRequiredWhenSecretsMissing"
      - name: Enforce apply-bundle gate not required when env unset
        run: |
          cd csharp
          dotnet test --no-build --filter "FullyQualifiedName~TryApplyExportedTemplatesFromEnvironment_ReturnsNotRequiredWhenUnset"
      - name: Enforce record-evidence gate not required when secrets missing
        if: ${{ secrets.HCDE_HCDESERV_PATH == '' || secrets.HCDE_IWAD_PATH == '' }}
        run: |
          cd csharp
          dotnet test --no-build --filter "FullyQualifiedName~TryRecordPassedValidationEvidence_ReturnsNotRequiredWhenSecretsMissing"
      - name: Enforce soak gate CI enforcement flag
        run: |
          cd csharp
          dotnet test --no-build --filter "FullyQualifiedName~ShouldEnforceInCi_ReturnsTrueWhenEnvSet"
      - name: Enforce record-evidence skip gate when secrets missing
        if: ${{ secrets.HCDE_HCDESERV_PATH == '' || secrets.HCDE_IWAD_PATH == '' }}
        run: |
          cd csharp
          dotnet test --no-build --filter "FullyQualifiedName~RecordEvidence_SkipsWhenHcdeservOrIwadMissing"
      - name: Enforce run-all skip gate when secrets missing
        if: ${{ secrets.HCDE_HCDESERV_PATH == '' || secrets.HCDE_IWAD_PATH == '' }}
        run: |
          cd csharp
          dotnet test --no-build --filter "FullyQualifiedName~RunAll_SkipsWhenHcdeservOrIwadMissing"
      - name: Enforce export committed templates gate
        env:
          HCDE_EXPORT_SOAK_TEMPLATES: '1'
          HCDE_SOAK_TEMPLATE_EXPORT_DIR: ${{ runner.temp }}/soak-export-gate-test
        run: |
          cd csharp
          dotnet test --no-build --filter "FullyQualifiedName~ExportCommittedTemplates_WritesCiArtifactBundle"
      - name: Enforce apply exported templates gate
        env:
          HCDE_EXPORT_SOAK_TEMPLATES: '1'
          HCDE_SOAK_TEMPLATE_EXPORT_DIR: ${{ runner.temp }}/soak-apply-gate-test
          HCDE_APPLY_SOAK_TEMPLATES: '1'
        run: |
          cd csharp
          dotnet test --no-build --filter "FullyQualifiedName~ExportCommittedTemplates_WritesCiArtifactBundle"
          dotnet test --no-build --filter "FullyQualifiedName~ApplyExportedTemplates_WritesCommittedSoakTree"
      - name: Enforce record-evidence manifest gate
        run: |
          cd csharp
          dotnet test --no-build --filter "FullyQualifiedName~RecordEvidence_WritesManifestWithHarnessStatuses"
      - name: Enforce record-evidence harness gate
        run: |
          cd csharp
          dotnet test --no-build --filter "FullyQualifiedName~RecordEvidence_WritesHarnessJsonFiles"
      - name: Enforce passed record-evidence gate
        env:
          HCDE_RECORD_PASSED_VALIDATION_EVIDENCE: '1'
        run: |
          cd csharp
          dotnet test --no-build --filter "FullyQualifiedName~TryRecordPassedValidationEvidence_PassesGateWhenBinariesPresent"
      - name: Enforce refresh committed evidence gate
        env:
          HCDE_REFRESH_SOAK_TEMPLATES: '1'
        run: |
          cd csharp
          dotnet test --no-build --filter "FullyQualifiedName~RefreshCommittedEvidence_ReplacesStaleHarnessFiles"
