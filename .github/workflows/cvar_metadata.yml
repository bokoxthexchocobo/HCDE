name: CVAR Metadata

on:
  push:
    paths:
      - "src/**"
      - "tools/cvar-*.ps1"
      - "tools/cvar-*.json"
      - "tools/generate-cvars-doc.ps1"
      - "wiki/CVAR-*.md"
  pull_request:
    paths:
      - "src/**"
      - "tools/cvar-*.ps1"
      - "tools/cvar-*.json"
      - "tools/generate-cvars-doc.ps1"
      - "wiki/CVAR-*.md"
  workflow_dispatch:

jobs:
  cvar-metadata:
    name: CVAR Categories & Docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install PowerShell
        run: |
          sudo apt-get update
          sudo apt-get install -y powershell

      - name: Audit CVAR metadata
        shell: pwsh
        run: |
          ./tools/audit-cvar-metadata.ps1 -FailOnMissingDescriptions

      - name: Generate source-only CVAR docs
        shell: pwsh
        run: |
          ./tools/generate-cvars-doc.ps1 -SourceOnly

      - name: Check generated docs are committed
        run: |
          git diff --exit-code wiki/CVAR-Categories.md || {
            echo "wiki/CVAR-Categories.md is out of date. Run ./tools/generate-cvars-doc.ps1 -SourceOnly and commit."
            exit 1
          }
