name: HCDE Server Debian Package

on:
  workflow_dispatch: {}
  push:
    branches:
      - main
    paths:
      - .github/workflows/hcdeserv_deb.yml

jobs:
  build:
    name: hcdeserv debian 12 amd64
    runs-on: ubuntu-latest
    container:
      image: debian:12

    steps:
      - name: Install runner tools
        shell: bash
        run: |
          apt-get -q update
          apt-get -q install -y ca-certificates curl git

      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Dependencies
        shell: bash
        run: |
          apt-get -q update
          apt-get -q install -y \
            build-essential \
            cmake \
            dpkg-dev \
            fakeroot \
            file \
            ninja-build \
            p7zip-full \
            libopenal-dev \
            libsdl2-dev \
            libwebp-dev \
            libbz2-dev \
            libomp-dev \
            libvpx-dev \
            waylandpp-dev

      - name: Configure
        shell: bash
        run: |
          cmake -B build -S . \
            -DPK3_QUIET_ZIPDIR=ON \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo

      - name: Build Server Payload
        shell: bash
        run: |
          cmake --build build --target \
            hcdeserv \
            hcdemaster \
            hcde_pk3 \
            brightmaps_pk3 \
            game_support_pk3 \
            game_widescreen_gfx_pk3 \
            lights_pk3 \
            hcde_mod_compat_pk3 \
            --parallel 2

      - name: Build .deb
        shell: bash
        run: |
          set -euo pipefail

          version="$(sed -n 's/^#define VERSIONSTR "\(.*\)"/\1/p' src/version.h)"
          short_sha="${GITHUB_SHA::7}"
          deb_version="${version}+git${short_sha}"
          package="hcdeserv"
          root="pkgroot"
          outdir="dist"

          rm -rf "$root" "$outdir" debian
          mkdir -p \
            "$root/DEBIAN" \
            "$root/opt/hcde-server/soundfonts" \
            "$root/opt/hcde-server/fm_banks" \
            "$root/usr/bin" \
            "$outdir" \
            debian

          install -m 0755 build/hcdeserv "$root/opt/hcde-server/hcdeserv"
          install -m 0755 build/hcdemaster "$root/opt/hcde-server/hcdemaster"
          install -m 0644 build/*.pk3 "$root/opt/hcde-server/"
          install -m 0644 soundfont/hcde.sf2 "$root/opt/hcde-server/soundfonts/"
          install -m 0644 fm_banks/GENMIDI.GS.wopl "$root/opt/hcde-server/fm_banks/"
          install -m 0644 fm_banks/gs-by-papiezak-and-sneakernets.wopn "$root/opt/hcde-server/fm_banks/"

          cat > "$root/usr/bin/hcdeserv" <<'EOF'
          #!/bin/sh
          cd /opt/hcde-server
          exec ./hcdeserv "$@"
          EOF
          chmod 0755 "$root/usr/bin/hcdeserv"

          cat > "$root/usr/bin/hcdemaster" <<'EOF'
          #!/bin/sh
          cd /opt/hcde-server
          exec ./hcdemaster "$@"
          EOF
          chmod 0755 "$root/usr/bin/hcdemaster"

          cat > debian/control <<'EOF'
          Source: hcdeserv
          Section: games
          Priority: optional
          Maintainer: HCDE Maintainers <noreply@example.invalid>
          Standards-Version: 4.6.2
          Package: hcdeserv
          Architecture: amd64
          Description: HCDE dedicated server
           Dedicated server runtime and data files for HCDE.
          EOF

          deps="$(dpkg-shlibdeps -O \
            -e"$root/opt/hcde-server/hcdeserv" \
            -e"$root/opt/hcde-server/hcdemaster" \
            | sed 's/^shlibs:Depends=//')"
          if [ -z "$deps" ]; then
            deps="libc6, libstdc++6, libgcc-s1, libopenal1, libsdl2-2.0-0, libbz2-1.0, libwebp7, libvpx7"
          fi

          installed_size="$(du -sk "$root" | awk '{print $1}')"
          cat > "$root/DEBIAN/control" <<EOF
          Package: $package
          Version: $deb_version
          Section: games
          Priority: optional
          Architecture: amd64
          Maintainer: HCDE Maintainers <noreply@example.invalid>
          Depends: $deps
          Installed-Size: $installed_size
          Description: HCDE dedicated server
           Dedicated server runtime and data files for HCDE.
          EOF

          fakeroot dpkg-deb --build "$root" "$outdir/${package}_${deb_version}_amd64.deb"
          dpkg-deb --info "$outdir/${package}_${deb_version}_amd64.deb"
          dpkg-deb --contents "$outdir/${package}_${deb_version}_amd64.deb" | sed -n '1,80p'

      - name: Upload .deb
        uses: actions/upload-artifact@v7
        with:
          name: hcdeserv-debian12-amd64-deb
          path: dist/*.deb
